[build]
  command = "bun install && bun run build"
  publish = "dist/client"

[functions]
  directory = "netlify/functions"

[dev]
  command = "bun run dev"
  targetPort = 5173
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
